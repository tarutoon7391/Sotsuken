# Issue-Agent（修正要望サイト → Issue → Agent SDK で自動修正 → PR）
# anthropics/claude-code-action の代わりに、scripts/issue-agent/index.mjs（@anthropic-ai/claude-agent-sdk）で修正する。
# 理由：Claude Code Action は Console の promo credit の対象外、Agent SDK は対象。
#
# 起動条件
#   ・Issue が opened で、ラベル request-site が付いている（修正要望サイトはラベル付きで Issue を作る）
#   ・Issue へのコメントに @claude が含まれ、コメント主が OWNER / MEMBER / COLLABORATOR（やり直し・追加指示用。手書きの Issue もこれで動かす）
#   ・PR のコメントでは起動しない
#   ・labeled では起動しない。ラベル付きで Issue を作ると opened + ラベル数ぶんの labeled が同時に飛び、
#     cancel-in-progress だと request-site 以外の labeled（if で skip される）が本命の実行を取り消してしまうため（Issue #53・#55 で発生）
# 同じ Issue の実行は 1 本だけ。実行中に @claude コメントが来ても取り消さず、終わってから順番に実行する
#
# 必要な Secrets
#   ・ANTHROPIC_API_KEY       … Anthropic Console の API キー（必須）
#   ・ISSUE_AGENT_GH_TOKEN    … 任意。contents/pull-requests/issues に write を持つ PAT。
#                              これが無いと GITHUB_TOKEN で PR を作るため pr-checks.yml（必須チェック）が自動で走らない
name: Claude Issue Agent

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

concurrency:
  group: issue-agent-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  agent:
    name: Issue を自動修正
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'request-site')) ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.ISSUE_AGENT_GH_TOKEN || github.token }}

      - name: Node.js を準備
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 依存をインストール
        run: npm ci

      # Agent SDK は claude の実行ファイルを同梱しているが、optional 依存が入らなかったときの保険として入れておく
      - name: Claude Code CLI をインストール
        run: npm i -g @anthropic-ai/claude-code

      - name: Issue-Agent を実行
        run: node scripts/issue-agent/index.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.ISSUE_AGENT_GH_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
          ISSUE_COMMENT_BODY: ${{ github.event.comment.body }}
