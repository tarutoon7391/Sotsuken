# Claude Code Action（修正要望サイト → Issue → 自動修正 PR）
# 公式 anthropics/claude-code-action の examples/claude.yml と docs/usage.md（2026-10-29 確認）に基づく。
# ・Issue の本文に @claude があれば起動する（修正要望サイトが作る Issue は末尾に @claude への指示を含む）
# ・Issue / PR へのコメントで @claude と書いても起動する（追加の指示・やり直し用）
# ・起動できるのはリポジトリに write 権限を持つユーザーだけ（action 側で確認される）
# ・既定では Claude は PR を作らずブランチを push してリンクを返すだけなので、
#   claude_args の --allowedTools で gh pr create を許可し、Issue の指示文で PR 作成まで指示している
name: Claude Code

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # PR の CI 結果を Claude が読むため
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # Claude がテスト（jest / vitest）とビルドを実行できるように依存を入れておく
      - name: Node.js を準備
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 依存をインストール
        run: npm ci

      - name: Claude Code を実行
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Claude が使ってよいツール。テスト・ビルド・PR 作成だけ許可する（git の commit/push は action が管理する）
          # モデルはラベルで切り替える：type:bug は難しい修正が多いので Opus、それ以外（見た目）は Sonnet。
          # issue / issue_comment は github.event.issue.labels、PR レビューコメントは github.event.pull_request.labels を見る
          claude_args: |
            --model ${{ (contains(github.event.issue.labels.*.name, 'type:bug') || contains(github.event.pull_request.labels.*.name, 'type:bug')) && 'claude-opus-5-5' || 'claude-sonnet-5-5' }}
            --max-turns 60
            --allowedTools "Bash(npm ci),Bash(npm install),Bash(npm test),Bash(npm test:*),Bash(npm run test:*),Bash(npm run build),Bash(npx jest:*),Bash(npx vitest:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr edit:*),Bash(gh issue view:*)"
            --append-system-prompt "このリポジトリの CLAUDE.md の規約に従うこと。コメント・コミットメッセージ・PR の説明はすべて日本語で書くこと。Issue のラベルが type:style なら許可パス（client/src/styles/**, client/src/**/*.css, client/src/**/*.jsx）以外のファイルを変更してはならない。type:bug なら必ず先に失敗するテストを追加してから修正し、npm test を通すこと。作業が終わったら必ず gh pr create で PR を作り、Issue に書かれたラベルを付け、本文の先頭に Closes #<Issue番号> を書くこと。"
