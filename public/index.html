<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sotsuken</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f3f2f2; color: #201e1d; margin: 0; padding: 40px 16px; }
  main { max-width: 560px; margin: 0 auto; }
  code { background: #e6e4e4; padding: 2px 6px; border-radius: 4px; }
  #health { font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Sotsuken</h1>
  <p>サーバーは動いています。ここは仮のトップページです（画面は <code>public/</code> に実装していく）。</p>
  <p>API の状態：<span id="health">確認中…</span></p>
</main>
<script>
  // 動作確認：/api/health を呼んで結果を表示する
  fetch('/api/health')
    .then(function (res) { return res.json(); })
    .then(function (data) {
      document.getElementById('health').textContent = data.db ? 'OK（DB 接続あり）' : 'OK（DB 未接続）';
    })
    .catch(function () {
      document.getElementById('health').textContent = '取得できませんでした';
    });
</script>
</body>
</html>
