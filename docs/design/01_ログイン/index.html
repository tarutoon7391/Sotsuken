<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ログイン ｜ （アプリ名）</title>
  <link rel="stylesheet" href="../common/broadsheet.css">
  <link rel="stylesheet" href="../common/screens-01-03.css">
</head>
<body>
<div class="app" id="app">
  <main class="auth">
    <div class="auth-panel">

      <!-- 1. アプリ名 -->
      <div class="brand">
        <h1 class="brand-name">（アプリ名）</h1>
        <p class="brand-tagline">授業のための、ライブ授業アプリ</p>
      </div>

      <!-- 2. ログインフォーム（POST /api/login） -->
      <form class="form" id="loginForm" action="/api/login" method="post" novalidate>
        <div class="form-alert" id="formAlert" role="alert" hidden>
          <i data-icon="warning-circle" data-size="18"></i>
          <span>ログインIDまたはパスワードが違います</span>
        </div>

        <div class="field">
          <label for="loginId">ログインID</label>
          <input class="input" id="loginId" name="login_id" type="text"
                 autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="例：hinata">
        </div>

        <div class="field">
          <label for="password">パスワード</label>
          <div class="pw-wrap">
            <input class="input" id="password" name="password" type="password" autocomplete="current-password">
            <button class="pw-toggle" type="button" data-pw-toggle="password"></button>
          </div>
        </div>

        <button class="btn btn-primary btn-block btn-lg" id="submitBtn" type="submit">ログイン</button>
      </form>

      <!-- 3. 登録への導線 -->
      <p class="auth-switch">はじめての方は <a href="../02_会員登録/index.html">会員登録</a></p>

    </div>
  </main>
</div>

<script src="../common/screens-01-03.js"></script>
<script src="login.js"></script>
</body>
</html>
